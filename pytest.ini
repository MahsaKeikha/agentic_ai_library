[pytest]
addopts = --import-mode=importlib
# The folders under systems/F*/ are standalone projects.  Many intentionally
# expose the same top-level package names (for example, ``orchestration``), so
# collecting every standalone suite in one interpreter causes import
# collisions.  The monorepo CI exercises them through the centralized batch
# and structural tests below; standalone repositories run their local suites
# in their own project context.
testpaths = tests systems/tests assessment_engine systems/F117_digital_twin_engineer/tests
