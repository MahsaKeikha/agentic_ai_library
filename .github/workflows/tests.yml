name: Agentic AI Library Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run Python test suite
        run: python -m pytest -q

  mars-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ATLAS MARS deterministic runtime tests
        run: node tests/test_atlas_mars_runtime.js

      - name: Run ATLAS MARS local API smoke tests
        run: node tests/test_atlas_mars_server.js

  smart-city-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Smart City client demo JavaScript syntax
        run: node --check docs/smart-city-agentic-ai.js

      - name: Run Smart City Agentic AI deterministic runtime tests
        run: node tests/test_smart_city_agentic_ai_runtime.js

  agewell-city-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check AGEWELL CITY JavaScript syntax
        run: |
          node --check docs/agewell-city-core.js
          node --check docs/agewell-city.js
          node --check docs/agewell-signature.js
          node --check docs/navigation.js

      - name: Run AGEWELL CITY deterministic runtime tests
        run: node tests/test_agewell_city_runtime.js
