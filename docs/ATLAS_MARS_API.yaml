openapi: 3.1.0
info:
  title: ATLAS MARS Mission Runtime API Contract
  version: 0.1.0
  description: |
    Reference contract for evolving the public ATLAS: MARS deterministic simulation
    into a server-side, authenticated mission-runtime service. This API is a design
    contract only and is not currently deployed by the public GitHub Pages demo.
servers:
  - url: https://example.invalid/atlas-mars
    description: Placeholder only. No production endpoint is claimed.
paths:
  /v1/runs:
    post:
      summary: Create a mission run
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /v1/runs/{runId}:
    get:
      summary: Read current mission state
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /v1/runs/{runId}/events:
    get:
      summary: Read append-only run events
      operationId: getRunEvents
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Ordered events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /v1/runs/{runId}/faults:
    post:
      summary: Inject an approved simulation or test fault
      operationId: injectFault
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fault_code]
              properties:
                fault_code:
                  type: string
                reason:
                  type: string
      responses:
        '202':
          description: Fault accepted into the simulation harness
  /v1/runs/{runId}/actions/propose:
    post:
      summary: Propose a tool action for policy evaluation
      operationId: proposeAction
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionProposal'
      responses:
        '200':
          description: Policy decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDecision'
  /v1/runs/{runId}/approvals:
    post:
      summary: Record a qualified human decision for a protected action
      operationId: createApproval
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Approval'
      responses:
        '201':
          description: Approval record stored
  /v1/runs/{runId}/package:
    get:
      summary: Export the mission decision package
      operationId: getMissionPackage
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Mission package
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateRunRequest:
      type: object
      required: [scenario, mode]
      properties:
        scenario:
          type: string
          enum: [dust, blackout, adversarial]
        mode:
          type: string
          enum: [simulation, shadow, production]
        idempotency_key:
          type: string
        requested_by:
          type: string
        environment:
          type: string
    Run:
      type: object
      required: [run_id, status, phase, authority_mode, state_version]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [READY, RUNNING, STABILIZED, DEGRADED_STABLE, MISSION_HOLD, FAILED]
        phase:
          type: string
        authority_mode:
          type: string
          enum: [OBSERVE_ONLY, BOUNDED, HUMAN_APPROVAL_REQUIRED]
        state_version:
          type: integer
        updated_at:
          type: string
          format: date-time
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
    Event:
      type: object
      required: [seq, event_id, run_id, occurred_at, event_type, actor, summary]
      properties:
        seq:
          type: integer
        event_id:
          type: string
        run_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        event_type:
          type: string
        actor:
          type: string
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true
        causation_id:
          type: string
        correlation_id:
          type: string
    ActionProposal:
      type: object
      required: [tool, actor, arguments, expected_authority_class]
      properties:
        tool:
          type: string
        actor:
          type: string
        arguments:
          type: object
          additionalProperties: true
        expected_authority_class:
          type: string
          enum: [READ_ONLY, ANALYSIS, BOUNDED_AUTONOMY, PROTECTED]
        idempotency_key:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
    ActionDecision:
      type: object
      required: [decision, tool, authority_class]
      properties:
        decision:
          type: string
          enum: [ALLOW, DENY, REQUIRE_APPROVAL]
        tool:
          type: string
        authority_class:
          type: string
        policy_reasons:
          type: array
          items:
            type: string
        approval_id:
          type: string
    Approval:
      type: object
      required: [action_id, decision, reviewer_id, reviewer_role, evidence_digest]
      properties:
        action_id:
          type: string
        decision:
          type: string
          enum: [APPROVE, REJECT, HOLD]
        reviewer_id:
          type: string
        reviewer_role:
          type: string
        evidence_digest:
          type: string
        comment:
          type: string
        signed_at:
          type: string
          format: date-time
    Blocker:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        message:
          type: string
        evidence:
          type: array
          items:
            type: string
